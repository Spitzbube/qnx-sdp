begin khronos

  begin egl display 1
    egl-dlls = libglapi-mesa_g.so libEGL-mesa_g.so
    glesv1-dlls = libglapi-mesa_g.so libGLESv1_CM-mesa_g.so
    glesv2-dlls = libglapi-mesa_g.so libGLESv2-mesa_g.so
    gpu-dlls = gpu_drm-vmwgfx_g.so
  end egl display

  begin wfd device 1
    wfd-dlls = libwfdcfg-vmwgfx-generic_g.so libWFDvmwgfx-drm_g.so

    # Run "drm-probe-displays" to list the available displays and pipelines,
    # and "use $GRAPHICS_ROOT/libWFDvmwgfx-drm_g.so" for more information on
    # these driver-specific settings.

    # Pipeline IDs 1 to 9 are used for DRM CRTCs.  One should be assigned
    # to each display that will be used.
    pipeline1-display = 1

    # VMWare Workstation/Player prior to version 15.5 supports full DX11 renderer
    # Since 15.5 version, DX11 renderer automatically switches to the basic renderer
    # with very limited support of formats.
    # If you are using VMWare Workstation/Player version that is older than 15.1, set this to 0
    # to re-enable full DX11 renderer.
    use_basic_dx_renderer = 1

    # The graphics data readback is time-intensive operation.  The full readback
    # enables readback for all buffers, including GLES ones.  This is required
    # to support cursor operation for transparent windows.
    # If cursor is not required, full readback can be disabled and only NATIVE
    # buffers would be updated.
    # Set to 1 to disable full readback and 0 re-enable it.
    disable_full_readback = 0
  end wfd device

end khronos

begin winmgr

  begin globals
    default-display = 1
    # Adjust the stack size of Screen's resmgr threads.  The default size
    # is insufficient for blitters/compositors using Mesa (e.g., gles2blt).
    stack-size = 65536  # in units of bytes
    alloc-config = vmwgfxdrm
    requests-logsize = 65536
    blit-config = vmwgfxdrm
    blits-logsize = 4096
    blit-defer = false
  end globals

  begin display 1
    video-mode = 1280 x 768 @ 60
    # Adjust the stack size of Screen's composition thread; required when the
    # display's framebuffer uses Mesa (e.g., "usage = gles2"), as noted above.
    stack-size = 65536  # in units of bytes
    defer-framebuffer-creation = false
    # Ensure that bypass mode is disabled to force composition of final image
    # to properly display results of CPU rendering applications
    allow-bypass = false
  end display

  begin class framebuffer-1
    display = 1
    pipeline = 1
    format = rgba8888
    usage = vmwgfxdrm
  end class

end winmgr
