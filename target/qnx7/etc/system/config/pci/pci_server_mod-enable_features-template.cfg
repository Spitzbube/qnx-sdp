################################################################################
#
# Template Configuration file for the Enable Features PCI Server Module
#
# This file (or one similar) can be used to control the runtime behaviour of the
# PCI server. Specifically, it defines the parameters which are processed by the
# pci_server-enable_features.so module version 2.2 or later.
#
# It is utilized by specifying it as the parameter to the --config= command
# line option to the pci_server-enable_features.so module. See also the 'use'
# information for that module
#
# Parameters and their acceptable values are described below. Parameter values
# are (typically) case invariant however certain values like names are not
#
# All text following a '#' until the end-of-line will be treated as a comment
#
# The '\' is a line continuation character and can be used to delimit parameter
# values for parameters that accept more than one value. If multiple parameter
# values are placed on a single line, a parameter specific delimiter is used
# (see the specific parameter for details)
#
# White space is ignored unless otherwise stated
#
# The following parameters are currently supported by the enable features server
# module
#
#    MPS - modify the PCI Express Max Payload Size for an Endpoint (EP) device
#
#
# The following sections detail the parameter usage for each supported parameter
#
#    <><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><><>
#
# IMPORTANT USAGE NOTICE
# ----------------------
#   Currently, this feature does not support hotplug.
#   If a device is live inserted into the system, the MPS settings for the
#   inserted device(s) will not be restored. This is only an issue if the MPS
#   settings have been changed from the default value of 128 bytes.
#   If hotplug of certain devices is required, users should construct the MPS
#   records accordingly and not use "all" in any MPS records. If a hotplug
#   device is connected to a switch with multiple downstream switch ports that
#   in turn have an EP, non-default MPS settings for those EPs will not be
#   possible with the current version of the server module. Similarly, an EP
#   connected to a hotplug capable Root Port cannot use non-default MPS settings
#   in the current version of the server module.
#   This limitation is imposed because of a lack of available hardware on which
#   to reliably test all scenarios and will be corrected in a subsequent version
#   of the server module
#
# MPS feature parameter value parsing
#
# MPS records consist of 2 required fields and have the following format
#
#    MPS=<EP|"all">:<mps|"max">
#
# The fields are delimited with a colon (:)
#
# The first field specifies the BDF of the Endpoint (EP) device to which the
# Max Payload Size value is to be applied or the case invariant text "all" to
# apply the MPS value to all EPs on the platform
#
# If the BDF does not refer to an EP, the record will be ignored
# The EP BDF field can take 2 forms with the BDF subfield delimited with a
# period (.)
#
#    B.D.F - for non-ARI devices
#    B.F   - for ARI devices
#
# In the case of targeting a specific EP, if the device is a multi-function or
# ARI device, the setting will be applied to all functions of the device. That
# is, all functions will be programmed with the same MPS value.
#
# Although not required, it is acceptable and even preferable to specify only
# one MPS record for an EP with the function portion of the field set to 0.
# Multiple records which have the same BxDy but a different Fz are accepted and
# will be processed as duplicates of Bx.Dy.F0. See discussion and examples for
# multiple records below
#
# The second field specifies the desired Payload Size or the case invariant
# text "max" to configure the maximum possible Payload Size based on the
# capabilities of all elements in the path to the EP device.
# If a specific value is provided, it must be one of the values as defined in
# the PCIe Specification for bits [2:0] of the Device Capabilities Register
# within the PCIe capability register set and as follows
#
#    128, 256, 512, 1024, 2048 or 4096 (bytes)
#
# It should be noted that if all elements from the Root of the hierarchy in
# which the EP resides do not support the specified Payload Size, the setting
# will be ignored.
# Similarly, when users specify a size, they need to consider the topology. If
# any element shares a path to more than one EP (an Upstream Switch Port is an
# example of this), then it may not be possible for the specified size to be
# configured and the user may not get what they expect
#
# Therefore using "max" is the safest way to ensure that the Payload is set to
# a usable value.
#
# Endpoint (EP) Devices (which are not functions of a multi-function or ARI
# device) for which no MPS record exists, will not be altered from their current
# setting. The PCIe Specification defined default MPS setting is 128 bytes which
# is supported by all compliant devices
#
# Multiple MPS records can be provided with later records targeting the same EP
# or "all" overriding the setting of previous records in the case of conflicts.
# Note however that if multiple conflicting records are provided, even if for
# different EPs but which share a path element (ex. switch port or Root Port),
# those records may be dropped.
# Also, in the case of multiple records targeting EPs which share a common path
# element, the records will be processed in ascending BDF order
#
# For example
#
#    MPS=1.0.0:max
#    MPS=all:1024
#
# will cause the setting for EP 1.0.0 to be ignored and may result in the MPS
# not being set at all if any component in the path to an EP does not support a
# size of 1024 bytes
#
#    MPS=all:1024
#    MPS=1.0.0:max
#
# may result in the MPS only being set for the path to EP 1.0.0 depending on the
# capabilities of the devices in other paths
#
#    MPS=4.0.0:max
#    MPS=3.0.0:128
#
# whereby EPs 3:0:0 and 4:0:0 share a commom path element, the record for EP
# 4:0:0 will be the one which is dropped
#
# The safest forms of MPS record are as follows
#
#    MPS=all:max
#    MPS=B.D.F:max
#
